feature_name: sinks
purpose: "PCM destinations: BufferSink for tests and offline render, DeviceSink for native output, PipeWireSink for a callback-shaped backend."

entry_points:
  - src/sink.rs
  - src/sink_device.rs
  - src/sink_pipewire.rs
  - src/insert.rs
  - src/bus.rs
  - examples/metronome.rs

apps:
  - src
  - examples

core_components:
  BufferSink: src/sink.rs
  DeviceSink: src/sink_device.rs
  PipeWireSink: src/sink_pipewire.rs
  Insert: src/insert.rs
  InsertChain: src/insert.rs
  Bus: src/bus.rs
  example_device_context: examples/support/mod.rs

user_flow:
  tests: "Context::new() uses BufferSink; mix sums tails; write advances write_cursor; latency_ms is 0"
  live: "App opens DeviceSink::new() → Context::with(negotiated rate/channels, sink) → play() then wait_until_end(); live mix origin is write_cursor/sample_rate"
  pipewire: "PipeWireSink::new injects MockStream; a real device uses PipeWireSink::with_backend"
  insert: "App calls ctx.set_inserts(...) → mix/write stay dry; render/process/callback run the chain"
  bus: "App calls ctx.bus(\"drums\") → extra dry store + insert chain; output folds buses then master inserts"

related_features:
  - context (owns the sink)
  - transport (start marks accepted; stop does not close)
  - instruments (mix PCM at sample frames)
  - engine (DeviceSink default; BufferSink via --buffer)

notes: >
  Instruments mix onto the Context sink or a named bus; there is no node graph.
  Playback inserts run at output, not inside mix. Extra buses are flat into master.
  cargo test uses BufferSink only. Live PipeWire tests are ignored unless
  DRYWET_LIVE_AUDIO=1.
