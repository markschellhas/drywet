feature_name: transport
purpose: "The arrangement clock: start/stop/pause/toggle, tempo, loop points, playhead, schedule APIs, fire_until, and tick."

entry_points:
  - src/transport.rs
  - examples/sixeight.rs

apps:
  - src
  - examples

user_flow:
  primary: "App calls ctx.transport().start() → state started, sink marked accepted, seconds reset to 0 from stopped"
  tempo: "App writes bpm 40–240; a write while started applies on the next start from stopped"
  schedule: "App registers schedule / schedule_repeat callbacks that receive sample time; tick is the live driver (fire_until(seconds+lookahead)); start() is not; ctx.render is the offline driver"
  stop: "App calls stop() → arrangement clock stops and sink.stop() without close; dispose() also closes the sink"

related_features:
  - context (owns the Transport; render lives on Context)
  - time (to_seconds / to_ticks / to_frequency)
  - events (Sequence / Part / Loop attach via SequenceClock)
  - sinks (start marks accepted; stop does not close)
  - instruments (callbacks pass time into triggers)

notes: >
  ctx.transport() is a short-lived TransportRef. PPQ 192. MAX_SCHEDULE_SECONDS 600.
  DEFAULT_LOOKAHEAD_S 0.04. Language timers are not the clock. tick while
  Stopped/Paused is a no-op.
